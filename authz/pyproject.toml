[project]
name = "authz"
version = "0.1.0"
description = "JWT verification and Hydra introspection"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "uvicorn>=0.30.6",
]

[project.scripts]
authz = "authz.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
