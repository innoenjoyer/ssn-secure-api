services:
  traefik:
    image: traefik:v3.1
    ports:
      - "8080:80"
      - "8081:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [edge, internal]
    depends_on: [api, authz, hydra]

  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    environment:
      DSN: memory
      SECRETS_SYSTEM: test-secret
      URLS_SELF_ISSUER: http://hydra:4444
      STRATEGIES_ACCESS_TOKEN: ${TOKEN_STRATEGY:-jwt}
      TTL_ACCESS_TOKEN: ${TOKEN_TTL:-5m}
    networks: [internal]

  hydra-init:
    image: oryd/hydra:v2.2.0
    command: >
      create client --endpoint http://hydra:4445
      --grant-type client_credentials
      --scope read,write
      --format json
    restart: on-failure
    depends_on: [hydra]
    networks: [internal]

  authz:
    build: ./authz
    environment:
      HYDRA_PUBLIC: http://hydra:4444
      HYDRA_ADMIN: http://hydra:4445
    networks: [internal]

  api:
    build: ./api
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true
